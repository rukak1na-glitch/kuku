<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九九れんしゅう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FA; --grid:#D8E2F1; --paper:#FFFFFF; --card:#FFE15A; --card-edge:#E3C23A; --card-ink:#1E2B4A;
  --ink:#1E2B4A; --sub:#5B6784; --ok:#1F8E53; --ng:#D63535; --chip:#E1E8F4; --chip-on:#1E2B4A; --chip-on-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121929; --grid:#1C2640; --paper:#1A2335; --card:#EACB45; --card-edge:#C4A62C; --card-ink:#1E2B4A;
    --ink:#E8EDF7; --sub:#9AA6C0; --ok:#4CC282; --ng:#FF6B6B; --chip:#253049; --chip-on:#EACB45; --chip-on-ink:#1E2B4A;
  }
}
:root[data-theme="dark"]{
  --bg:#121929; --grid:#1C2640; --paper:#1A2335; --card:#EACB45; --card-edge:#C4A62C; --card-ink:#1E2B4A;
  --ink:#E8EDF7; --sub:#9AA6C0; --ok:#4CC282; --ng:#FF6B6B; --chip:#253049; --chip-on:#EACB45; --chip-on-ink:#1E2B4A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 24px}
.screen{display:none}
.screen.on{display:block}
h1{font-size:28px;font-weight:900;margin:8px 0 4px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 18px;font-size:15px;line-height:1.6}
.panel{background:var(--paper);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--grid)}
.panel h2{font-size:16px;margin:0 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:inherit;font-weight:700;
  font-size:17px;min-width:48px;height:44px;padding:0 14px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.row+.row{border-top:1px solid var(--grid)}
.row label{font-size:16px;font-weight:500}
.row small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;font-weight:500}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--chip);position:relative;cursor:pointer;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch:checked{background:var(--ok)}
.switch:checked::after{left:25px}
.btn{
  display:block;width:100%;border:0;border-radius:14px;font:inherit;font-weight:900;font-size:20px;
  padding:16px;cursor:pointer;background:var(--card-ink);color:#FFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:var(--card);color:var(--card-ink)}}
:root[data-theme="dark"] .btn{background:var(--card);color:var(--card-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:17px;padding:12px}
.btn+.btn{margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
.hist{list-style:none;margin:0;padding:0;font-size:15px}
.hist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--grid)}
.hist li:last-child{border-bottom:0}
.muted{color:var(--sub);font-size:14px}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak span{background:var(--chip);border-radius:8px;padding:4px 10px;font-weight:700;font-size:15px}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;font-weight:700}
.top .count{font-size:18px}
.top .time{font-size:18px;font-variant-numeric:tabular-nums}
.quit{border:0;background:transparent;color:var(--sub);font:inherit;font-size:15px;cursor:pointer;padding:6px}
.pace{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-bottom:14px}
.pace i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s linear}
.pace.slow i{background:var(--ng)}
.card{
  position:relative;background:var(--card);color:var(--card-ink);border-radius:20px;
  border-bottom:8px solid var(--card-edge);padding:40px 16px 28px;text-align:center;
  font-variant-numeric:tabular-nums;transition:transform .12s;
}
.card::before{
  content:"";position:absolute;top:14px;left:18px;width:16px;height:16px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);
}
.q{font-size:clamp(72px,24vw,128px);font-weight:900;line-height:1;letter-spacing:.02em}
.q .x{font-size:.6em;margin:0 .12em;vertical-align:.12em}
.fb{height:44px;margin-top:14px;font-size:30px;font-weight:900}
.card.ok{animation:pop .22s}
.card.ng .fb{color:var(--ng)}
@keyframes pop{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.card.ok{animation:none}.pace i{transition:none}}
.heard{display:flex;align-items:center;gap:8px;margin:14px 0 10px;min-height:28px;font-size:15px}
.mic{flex:none;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--chip);color:var(--sub)}
.mic.live{background:var(--ok);color:#fff}
.mic.bad{background:var(--ng);color:#fff}
.heard .txt{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry{text-align:center;font-size:40px;font-weight:900;height:52px;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{
  border:0;border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;font-weight:900;
  font-size:28px;height:60px;cursor:pointer;border:1px solid var(--grid);
}
.pad button:active{background:var(--chip)}
.pad .ok{background:var(--ok);color:#fff;font-size:20px;border-color:transparent}
.pad .del{font-size:18px}

/* result */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:24px}
.score p{margin:8px 0 0;color:var(--sub)}
.est{font-size:18px;font-weight:700;text-align:center;margin:0}
.est b{font-size:28px;font-variant-numeric:tabular-nums}
.est.good b{color:var(--ok)}
.list{list-style:none;padding:0;margin:0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--grid)}
.list li:last-child{border-bottom:0}
.list .ng{color:var(--ng)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 設定 -->
  <section id="setup" class="screen on">
    <h1>九九れんしゅう</h1>
    <p class="lead">カードの九九に声で答えよう。聞き取れないときは下の数字ボタンでもOK。</p>

    <div class="panel">
      <h2>れんしゅうする段</h2>
      <div class="chips" id="dans"></div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" id="allDans" type="button">ぜんぶ</button>
      </div>
    </div>

    <div class="panel">
      <h2>問題の数</h2>
      <div class="chips" id="counts"></div>
    </div>

    <div class="panel">
      <div class="row">
        <label for="optVoice">声で答える<small>マイクを使って答えを聞き取ります</small></label>
        <input type="checkbox" class="switch" id="optVoice">
      </div>
      <div class="row">
        <label for="optSpeak">問題を読み上げる<small>声で答えるのと同時だと、端末によって聞き取りが不安定になることがあります</small></label>
        <input type="checkbox" class="switch" id="optSpeak">
      </div>
      <div class="row">
        <label for="optWeak">苦手な問題を多めに出す<small>まちがえた・時間がかかった問題が出やすくなります</small></label>
        <input type="checkbox" class="switch" id="optWeak">
      </div>
    </div>

    <button class="btn" id="startBtn" type="button">はじめる</button>

    <div class="panel" style="margin-top:14px">
      <h2>苦手な問題</h2>
      <div id="weakList"></div>
    </div>
    <div class="panel">
      <h2>これまでの記録</h2>
      <div id="histList"></div>
    </div>
  </section>

  <!-- 問題 -->
  <section id="quiz" class="screen">
    <div class="top">
      <span class="count" id="qCount">1 / 20</span>
      <span class="time" id="qTime">0.0秒</span>
      <button class="quit" id="quitBtn" type="button">やめる</button>
    </div>
    <div class="pace" id="pace"><i></i></div>
    <div class="card" id="card">
      <div class="q" id="qText">7<span class="x">×</span>8</div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="heard">
      <span class="mic" id="mic">マイク未使用</span>
      <span class="txt" id="heard"></span>
    </div>
    <div class="entry" id="entry" aria-live="polite"></div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="panel score">
      <div class="big" id="rScore">18<small> / 20</small></div>
      <p id="rTime"></p>
    </div>
    <div class="panel">
      <p class="est" id="rEst"></p>
    </div>
    <div class="panel" id="rMissPanel">
      <h2>まちがえた問題</h2>
      <ul class="list" id="rMiss"></ul>
    </div>
    <div class="panel">
      <h2>時間がかかった問題</h2>
      <ul class="list" id="rSlow"></ul>
    </div>
    <button class="btn" id="retryMissBtn" type="button">まちがえた問題をもう一回</button>
    <button class="btn" id="againBtn" type="button">同じ設定でもう一回</button>
    <button class="btn ghost" id="homeBtn" type="button">最初の画面にもどる</button>
  </section>

</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  const TARGET_SEC = 180 / 50; // 50問3分 → 1問3.6秒
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let settings = Object.assign({dans:[1,2,3,4,5,6,7,8,9], count:20, voice:true, speak:false, weak:true}, store.get('kuku-settings', {}));
  let stats = store.get('kuku-stats', {});      // "a×b": {n, miss, ms}
  let history = store.get('kuku-history', []);  // [{d, n, c, ms}]

  // ---------- 設定画面 ----------
  function renderSetup(){
    const dans = $('#dans'); dans.innerHTML = '';
    for(let i=1;i<=9;i++){
      const b = document.createElement('button');
      b.type='button'; b.className='chip'; b.textContent = i+'の段';
      b.setAttribute('aria-pressed', settings.dans.includes(i));
      b.onclick = () => {
        if(settings.dans.includes(i)){ if(settings.dans.length>1) settings.dans = settings.dans.filter(x=>x!==i); }
        else settings.dans = settings.dans.concat(i).sort();
        save(); renderSetup();
      };
      dans.appendChild(b);
    }
    $('#allDans').setAttribute('aria-pressed', settings.dans.length===9);
    const counts = $('#counts'); counts.innerHTML='';
    [10,20,50].forEach(n=>{
      const b = document.createElement('button');
      b.type='button'; b.className='chip'; b.textContent = n+'問';
      b.setAttribute('aria-pressed', settings.count===n);
      b.onclick = () => { settings.count=n; save(); renderSetup(); };
      counts.appendChild(b);
    });
    $('#optVoice').checked = settings.voice && !!SR;
    $('#optVoice').disabled = !SR;
    $('#optSpeak').checked = settings.speak;
    $('#optWeak').checked = settings.weak;

    // 苦手
    const weak = Object.entries(stats)
      .filter(([k,s]) => s.n>0)
      .map(([k,s]) => [k, weakScore(s)])
      .filter(([k,v]) => v>0.5)
      .sort((a,b)=>b[1]-a[1]).slice(0,8);
    $('#weakList').innerHTML = weak.length
      ? '<div class="weak">'+weak.map(([k])=>'<span>'+k+'</span>').join('')+'</div>'
      : '<p class="muted" style="margin:0">練習すると、ここに苦手な問題が出てきます。</p>';

    // 記録
    const h = history.slice(-6).reverse();
    $('#histList').innerHTML = h.length
      ? '<ul class="hist">'+h.map(r=>{
          const est = r.ms/r.n*50/1000;
          return '<li><span>'+r.d+'</span><span>'+r.c+'/'+r.n+'問　50問なら'+fmtMin(est)+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="muted" style="margin:0">まだ記録はありません。</p>';
  }
  $('#allDans').onclick = () => { settings.dans=[1,2,3,4,5,6,7,8,9]; save(); renderSetup(); };
  $('#optVoice').onchange = e => { settings.voice=e.target.checked; save(); };
  $('#optSpeak').onchange = e => { settings.speak=e.target.checked; save(); };
  $('#optWeak').onchange = e => { settings.weak=e.target.checked; save(); };
  function save(){ store.set('kuku-settings', settings); }

  function weakScore(s){
    const avg = s.ms / s.n / 1000;
    return (s.miss / s.n) * 4 + Math.max(0, avg - 2.5);
  }

  // ---------- 問題づくり ----------
  function makeQuestions(n, fixed){
    if(fixed) return shuffle(fixed.slice());
    const pool = [];
    settings.dans.forEach(a => { for(let b=1;b<=9;b++) pool.push([a,b]); });
    const w = pool.map(([a,b]) => {
      const s = stats[a+'×'+b];
      return 1 + (settings.weak && s && s.n ? weakScore(s)*1.5 : 0);
    });
    const out = []; let prev = null;
    while(out.length < n){
      let total = w.reduce((x,y)=>x+y,0), r = Math.random()*total, i = 0;
      while(r > w[i]){ r -= w[i]; i++; }
      const q = pool[i];
      if(pool.length>1 && prev && q[0]===prev[0] && q[1]===prev[1]) continue;
      out.push(q); prev = q;
    }
    return out;
  }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // ---------- 音声の数字読み取り ----------
  const KANA = [['ひゃく','百'],['びゃく','百'],['ぴゃく','百'],['じゅう','十'],['じゅっ','十'],['じっ','十'],
    ['きゅう','九'],['しち','七'],['なな','七'],['はち','八'],['はっ','八'],['ろく','六'],['ろっ','六'],
    ['よん','四'],['さん','三'],['いち','一'],['いっ','一'],['ぜろ','〇'],['れい','〇'],['ご','五'],['に','二'],['く','九'],['し','四']];
  const KD = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  function extractNums(t){
    t = t.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    const out = [];
    (t.match(/\d+/g) || []).forEach(s => out.push(parseInt(s,10)));
    let h = t.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
    KANA.forEach(([k,v]) => { h = h.split(k).join(v); });
    (h.match(/[〇一二三四五六七八九十百]+/g) || []).forEach(s => {
      let total=0, cur=0;
      for(const ch of s){
        if(ch==='百'){ total += (cur||1)*100; cur=0; }
        else if(ch==='十'){ total += (cur||1)*10; cur=0; }
        else cur = KD[ch];
      }
      out.push(total+cur);
    });
    return out;
  }

  // ---------- 練習 ----------
  let qs=[], idx=0, cur=null, results=[], running=false, locked=false;
  let qT0=0, sT0=0, tick=null, buf='';
  let rec=null, wantRec=false, qStart=0, speaking=false;

  function start(fixed){
    qs = makeQuestions(fixed ? fixed.length : settings.count, fixed);
    idx=0; results=[]; running=true; locked=false;
    show('quiz');
    // iOSでは読み上げ・マイクは操作の直後に始める必要がある
    if(settings.speak && window.speechSynthesis){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} }
    if(settings.voice && SR) startRec(); else setMic('off');
    sT0 = performance.now();
    clearInterval(tick); tick = setInterval(updateTime, 100);
    next();
  }

  function next(){
    if(idx >= qs.length){ finish(); return; }
    const [a,b] = qs[idx];
    cur = {a, b, ans:a*b};
    $('#qCount').textContent = (idx+1)+' / '+qs.length;
    $('#qText').innerHTML = a+'<span class="x">×</span>'+b;
    $('#fb').textContent = ''; $('#card').className = 'card';
    $('#heard').textContent = ''; buf=''; $('#entry').textContent='';
    locked=false;
    qT0 = performance.now();
    if(settings.speak && window.speechSynthesis){
      speaking = true;
      const u = new SpeechSynthesisUtterance(a+' かける '+b);
      u.lang='ja-JP'; u.rate=1.25;
      u.onend = u.onerror = () => { setTimeout(()=>{ speaking=false; }, 250); };
      try{ speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ speaking=false; }
    }
  }

  function answer(ok, given){
    if(locked || !running) return;
    locked = true;
    const ms = performance.now() - qT0;
    results.push({a:cur.a, b:cur.b, ok, ms, given});
    const k = cur.a+'×'+cur.b;
    const s = stats[k] || {n:0, miss:0, ms:0};
    s.n++; s.ms += ms; if(!ok) s.miss++;
    stats[k] = s; store.set('kuku-stats', stats);
    idx++;
    if(ok){
      $('#card').className = 'card ok';
      $('#fb').style.color = 'var(--ok)'; $('#fb').textContent = '○';
      setTimeout(next, 280);
    }else{
      $('#card').className = 'card ng';
      $('#fb').style.color = ''; $('#fb').textContent = '＝ '+cur.ans;
      setTimeout(next, 1400);
    }
  }

  function updateTime(){
    if(!running) return;
    $('#qTime').textContent = ((performance.now()-sT0)/1000).toFixed(1)+'秒';
    const q = (performance.now()-qT0)/1000;
    const pct = Math.min(100, q/TARGET_SEC*100);
    $('#pace i').style.width = pct+'%';
    $('#pace').classList.toggle('slow', q > TARGET_SEC);
  }

  function finish(){
    running=false; clearInterval(tick); stopRec();
    const n = results.length, c = results.filter(r=>r.ok).length;
    const ms = results.reduce((x,r)=>x+r.ms,0);
    if(n>0){
      const d = new Date();
      history.push({d:(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'), n, c, ms});
      history = history.slice(-30); store.set('kuku-history', history);
    }
    $('#rScore').innerHTML = c+'<small> / '+n+'問せいかい</small>';
    $('#rTime').textContent = 'かかった時間 '+(ms/1000).toFixed(1)+'秒（1問 平均'+(n?(ms/n/1000).toFixed(1):'0')+'秒）';
    const est = n ? ms/n*50/1000 : 0;
    $('#rEst').className = 'est'+(est<=180?' good':'');
    $('#rEst').innerHTML = '50問だと 約<b>'+fmtMin(est)+'</b><br><span class="muted">目標は3分（1問3.6秒）</span>';
    const miss = results.filter(r=>!r.ok);
    $('#rMissPanel').style.display = miss.length ? '' : 'none';
    $('#retryMissBtn').style.display = miss.length ? '' : 'none';
    $('#rMiss').innerHTML = miss.map(r=>'<li><span>'+r.a+' × '+r.b+' ＝ '+(r.a*r.b)+'</span><span class="ng">'+(r.given!=null?r.given+'と答えた':'')+'</span></li>').join('');
    const slow = results.filter(r=>r.ok).sort((x,y)=>y.ms-x.ms).slice(0,5);
    $('#rSlow').innerHTML = slow.length ? slow.map(r=>'<li><span>'+r.a+' × '+r.b+' ＝ '+(r.a*r.b)+'</span><span>'+(r.ms/1000).toFixed(1)+'秒</span></li>').join('') : '<li class="muted">なし</li>';
    show('result');
  }

  function quit(){
    running=false; clearInterval(tick); stopRec();
    try{ speechSynthesis.cancel(); }catch(e){}
    show('setup'); renderSetup();
  }

  // ---------- マイク ----------
  function setMic(state){
    const m = $('#mic');
    m.className = 'mic'+(state==='live'?' live':state==='bad'?' bad':'');
    m.textContent = state==='live' ? '🎤 聞いています' : state==='bad' ? 'マイクが使えません' : 'マイク未使用';
    if(state==='bad') $('#heard').textContent = '数字ボタンで答えてね';
  }
  function startRec(){
    try{
      rec = new SR();
      rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
      wantRec = true; qStart = 0;
      rec.onstart = () => setMic('live');
      rec.onresult = e => {
        if(!running) return;
        if(speaking || locked){ qStart = e.results.length; return; }
        for(let i=Math.max(qStart, e.resultIndex); i<e.results.length; i++){
          const t = e.results[i][0].transcript;
          $('#heard').textContent = '「'+t+'」';
          const nums = extractNums(t);
          if(nums.includes(cur.ans)){ qStart = i+1; answer(true); return; }
          // 問題の数字を言っているだけ（例：「しちは…」）のときは待つ
          const onlyQ = nums.every(v => v===cur.a || v===cur.b);
          if(e.results[i].isFinal && nums.length && !onlyQ){ qStart = i+1; answer(false, nums[nums.length-1]); return; }
        }
      };
      rec.onerror = e => {
        if(e.error==='not-allowed' || e.error==='service-not-allowed' || e.error==='audio-capture'){
          wantRec=false; setMic('bad');
          $('#heard').textContent = '数字ボタンで答えてね（原因: '+e.error+'）';
        }
      };
      rec.onend = () => {
        if(running && wantRec){ qStart = 0; try{ rec.start(); }catch(err){ setMic('bad'); } }
        else if(wantRec===false && running){ /* 状態はそのまま */ }
        else setMic('off');
      };
      rec.start();
    }catch(e){ wantRec=false; setMic('bad'); }
  }
  function stopRec(){ wantRec=false; if(rec){ try{ rec.abort(); }catch(e){} rec=null; } }

  // ---------- 数字ボタン ----------
  (function buildPad(){
    const pad = $('#pad');
    ['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(k=>{
      const b = document.createElement('button'); b.type='button';
      if(k==='del'){ b.textContent='けす'; b.className='del'; }
      else if(k==='ok'){ b.textContent='こたえる'; b.className='ok'; }
      else b.textContent=k;
      b.onclick = () => press(k);
      pad.appendChild(b);
    });
  })();
  function press(k){
    if(!running || locked) return;
    if(k==='del'){ buf = buf.slice(0,-1); }
    else if(k==='ok'){ if(buf) submitBuf(); return; }
    else if(buf.length<2){ buf += k; }
    $('#entry').textContent = buf;
    if(buf === String(cur.ans) || buf.length===2) submitBuf();
  }
  function submitBuf(){
    const v = parseInt(buf,10);
    answer(v===cur.ans, v);
  }

  // ---------- 共通 ----------
  function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }
  function fmtMin(sec){ const m=Math.floor(sec/60), s=Math.round(sec%60); return (m? m+'分':'')+s+'秒'; }

  let lastMiss = [];
  $('#startBtn').onclick = () => start();
  $('#quitBtn').onclick = quit;
  $('#againBtn').onclick = () => start();
  $('#retryMissBtn').onclick = () => { start(results.filter(r=>!r.ok).map(r=>[r.a,r.b])); };
  $('#homeBtn').onclick = () => { show('setup'); renderSetup(); };

  renderSetup();
})();
</script>
